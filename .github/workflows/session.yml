name: session
on:
  workflow_dispatch:
    inputs:
      session_id: { required: true }
      token: { required: true }
      apk_key: { required: true }
      minutes: { default: "335" }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install stream server deps (ws + scrcpy-server)
        run: |
          npm install --prefix runner --omit=dev
          curl -fsSL -o scrcpy-server.jar https://github.com/Genymobile/scrcpy/releases/download/v3.1/scrcpy-server-v3.1
          ls -l scrcpy-server.jar
      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cf.deb
          sudo dpkg -i cf.deb
      - name: Download APK
        run: |
          H="Authorization: Bearer ${{ secrets.CALLBACK_SECRET }}"
          U="${{ secrets.WORKER_URL }}/apk/${{ inputs.apk_key }}"
          fail() {
            curl -s -X POST "${{ secrets.WORKER_URL }}/api/callback" -H "$H" -H "content-type: application/json" \
              -d "{\"id\":\"${{ inputs.session_id }}\",\"error\":\"$1\"}" || true
            echo "$1"; exit 1
          }
          if LINK=$(curl -fsS -H "$H" "$U/url"); then
            echo "Downloading APK from the given link..."
            case "$LINK" in
              *drive.google.com*|*docs.google.com*)
                pip install -q gdown
                gdown --fuzzy "$LINK" -O app.apk || fail "Google Drive se download fail (file public hai?)" ;;
              *)
                case "$LINK" in *dropbox.com*)
                  LINK=$(echo "$LINK" | sed 's/dl=0/dl=1/')
                  case "$LINK" in *dl=1*) ;; *\?*) LINK="$LINK&dl=1" ;; *) LINK="$LINK?dl=1" ;; esac ;;
                esac
                curl -fL --retry 3 --connect-timeout 30 --max-time 900 -A "Mozilla/5.0" -o app.apk "$LINK" \
                  || fail "Link se download fail (link direct aur public hona chahiye)" ;;
            esac
            [ "$(stat -c%s app.apk)" -gt 100000 ] || fail "Download ki hui file bahut chhoti hai - direct APK link do"
            [ "$(head -c2 app.apk)" = "PK" ] || fail "Ye APK nahi hai (webpage aayi) - direct download link do"
          else
            N=$(curl -fsS -H "$H" "$U/n") || fail "APK server par nahi mili"
            : > app.apk
            for i in $(seq 0 $((N-1))); do curl -fsS -H "$H" "$U/$i" >> app.apk; done
          fi
          ls -l app.apk
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          SESSION_ID: ${{ inputs.session_id }}
          SESSION_TOKEN: ${{ inputs.token }}
          MINUTES: ${{ inputs.minutes }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          cores: 4
          ram-size: 4096M
          heap-size: 576M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/run.sh
